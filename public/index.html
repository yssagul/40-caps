<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>40 Caps</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <button id="endGameBtn">End Game</button>

    <!-- Main Menu / Setup Overlay -->
    <div id="setupOverlay">
      <h1>40 Caps</h1>
      <h2>A chip-flicking game</h2>

      <!-- View: Mode Selection (default) -->
      <div id="modeSelect">
        <button id="localPlayBtn" class="menu-btn">Local Play</button>
        <button id="onlinePlayBtn" class="menu-btn accent">Online Play</button>
      </div>

      <!-- View: Local Setup -->
      <div id="localSetup" class="setup-view">
        <div class="setup-section">
          <label for="playerCount">Number of Players</label>
          <input type="number" id="playerCount" value="2" min="2" max="8">
        </div>

        <div class="setup-section">
          <label>Player Names</label>
          <div id="playerNamesContainer"></div>
        </div>

        <button id="advancedToggle">Advanced Settings</button>

        <div id="advancedSettings">
          <div class="slider-row">
            <label>Table Friction</label>
            <input type="range" id="frictionTable" min="0.05" max="1.0" step="0.05" value="0.3">
            <span class="slider-value" id="frictionTableVal">0.30</span>
          </div>
          <div class="slider-row">
            <label>Chip Top Friction</label>
            <input type="range" id="frictionChipTop" min="0.05" max="1.0" step="0.05" value="0.4">
            <span class="slider-value" id="frictionChipTopVal">0.40</span>
          </div>
          <div class="slider-row">
            <label>Chip Bottom Friction</label>
            <input type="range" id="frictionChipBottom" min="0.05" max="1.0" step="0.05" value="0.5">
            <span class="slider-value" id="frictionChipBottomVal">0.50</span>
          </div>
          <div class="slider-row">
            <label>Damping Scale</label>
            <input type="range" id="dampingScale" min="1" max="20" step="0.5" value="12">
            <span class="slider-value" id="dampingScaleVal">12.0</span>
          </div>
          <div class="slider-row">
            <label>Chip Restitution</label>
            <input type="range" id="chipRestitution" min="0" max="1.0" step="0.05" value="0.3">
            <span class="slider-value" id="chipRestitutionVal">0.30</span>
          </div>
        </div>

        <button id="startBtn" class="menu-btn accent">Start Game</button>
        <button id="localBackBtn" class="back-btn">Back</button>
      </div>

      <!-- View: Online Menu (Create or Join) -->
      <div id="onlineMenu" class="setup-view">
        <div class="setup-section">
          <label for="onlineName">Your Name</label>
          <input type="text" id="onlineName" placeholder="Enter your name" maxlength="20">
        </div>

        <button id="createRoomBtn" class="menu-btn accent">Create Room</button>

        <div class="divider-text">or join an existing room</div>

        <div class="join-row">
          <input type="text" id="roomCodeInput" placeholder="Code" maxlength="4" inputmode="numeric" pattern="[0-9]{4}">
          <button id="joinRoomBtn" class="menu-btn small">Join</button>
        </div>

        <div id="onlineAdvToggle" class="advanced-toggle-link">Advanced Settings</div>
        <div id="onlineAdvSettings" class="advanced-settings-panel">
          <div class="slider-row">
            <label>Table Friction</label>
            <input type="range" id="onFrictionTable" min="0.05" max="1.0" step="0.05" value="0.3">
            <span class="slider-value" id="onFrictionTableVal">0.30</span>
          </div>
          <div class="slider-row">
            <label>Chip Top Friction</label>
            <input type="range" id="onFrictionChipTop" min="0.05" max="1.0" step="0.05" value="0.4">
            <span class="slider-value" id="onFrictionChipTopVal">0.40</span>
          </div>
          <div class="slider-row">
            <label>Chip Bottom Friction</label>
            <input type="range" id="onFrictionChipBottom" min="0.05" max="1.0" step="0.05" value="0.5">
            <span class="slider-value" id="onFrictionChipBottomVal">0.50</span>
          </div>
          <div class="slider-row">
            <label>Damping Scale</label>
            <input type="range" id="onDampingScale" min="1" max="20" step="0.5" value="12">
            <span class="slider-value" id="onDampingScaleVal">12.0</span>
          </div>
          <div class="slider-row">
            <label>Chip Restitution</label>
            <input type="range" id="onChipRestitution" min="0" max="1.0" step="0.05" value="0.3">
            <span class="slider-value" id="onChipRestitutionVal">0.30</span>
          </div>
        </div>

        <div id="onlineError" class="error-msg"></div>
        <button id="onlineBackBtn" class="back-btn">Back</button>
      </div>

      <!-- View: Waiting Room / Lobby -->
      <div id="waitingRoom" class="setup-view">
        <div id="roomCodeDisplay">
          <span class="room-label">Room Code</span>
          <span id="roomCodeBig">----</span>
        </div>
        <div id="lobbyPlayerList"></div>
        <button id="lobbyStartBtn" class="menu-btn accent" style="display:none">Start Game</button>
        <button id="leaveRoomBtn" class="back-btn">Leave Room</button>
      </div>
    </div>

    <!-- End Game Overlay -->
    <div id="endOverlay">
      <h1>Game Over</h1>
      <div id="endScoreboard"></div>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
